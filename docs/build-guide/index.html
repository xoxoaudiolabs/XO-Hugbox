<script>/* model.js */
// XO-Hugbox 3D model: every part built from hardware/layout.py, the routed KiCad board and the STLs
// (all packed into data.js). Coordinates are plate coordinates in mm, x right, y up (toward the
// screen end), z up from the shell floor - the same frame as layout.py and assembly.scad.
// Classic script: defines window.buildHugboxModel(THREE) so the bundled page needs only one ES module.
window.buildHugboxModel = function (THREE) {
'use strict';

const D = window.HUGBOX_DATA;
const L = D.layout;
const PCB = D.pcb;
const FP = Object.fromEntries(PCB.fps.map((f) => [f.ref, f]));

const Z = {};
Z.pcb = L.Z_PCB;                       // PCB underside
Z.pcbTop = L.Z_PCB + L.PCB_T;          // PCB top
Z.plate = L.Z_PLATE_BOT;               // plate underside (1 mm spacers)
Z.plateTop = L.Z_PLATE_BOT + L.PLATE_T;
Z.hdr = 2.5;                           // header plastic between PCB and the bottom modules
Z.modTop = Z.pcb - Z.hdr;              // bottom modules: face toward the PCB
Z.strip = Z.plate + ((L.Z_PCB + L.PCB_T + L.POT_BODY_H) - L.Z_PLATE_BOT) + 2.0;   // raised pot strip top

// pad names printed on the board silk for the custom footprints (hardware/pcb/build.py)
const PADNAMES = {
  U1: ['D0', 'D1', 'D2', 'D3', 'D4', 'D5', 'D6', '5V', 'GND', '3V3', 'D10', 'D9', 'D8', 'D7'],
  U2: ['P0', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7'],
  U3: ['LRC', 'BCLK', 'DIN', 'GAIN', 'SD', 'GND', 'VIN'],
  U4: ['SCK', 'BCK', 'DIN', 'LCK', 'GND', 'VIN'],
  U5: ['SDA', 'SCL', 'VCC', 'GND'],
  J9: ['VCC', 'GND', 'SDA', 'SCL'],
  J11: ['BAT-', 'BAT+'],
  J13: ['+', '-'],
  SW18: ['RAW', 'ON', '(nc)'],
  RV1: ['GND', 'W', '3V3'], RV2: ['GND', 'W', '3V3'], RV3: ['GND', 'W', '3V3'], RV4: ['GND', 'W', '3V3'],
};

// ---------------------------------------------------------------- part registry
const parts = new Map();
const root = new THREE.Group();

class Part {
  constructor(id, o) {
    Object.assign(this, { name: id, step: 0, explode: 0, info: '', refs: [], qty: 1, xray: false }, o);
    this.id = id;
    this.group = new THREE.Group();
    this.group.name = id;
    this.mats = new Map();
    this.state = 'normal';
    root.add(this.group);
    parts.set(id, this);
  }
  mat(color, o = {}) {
    const key = color + JSON.stringify(o);
    if (!this.mats.has(key)) {
      const m = new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...o });
      m.userData.base = { opacity: m.opacity, transparent: m.transparent, emissive: m.emissive.getHex() };
      this.mats.set(key, m);
    }
    return this.mats.get(key);
  }
  add(geom, color, x = 0, y = 0, z = 0, o) {
    const m = new THREE.Mesh(geom, color instanceof THREE.Material ? color : this.mat(color, o));
    if (color instanceof THREE.Material && !this.mats.has(color.uuid)) {
      color.userData.base = { opacity: color.opacity, transparent: color.transparent, emissive: color.emissive ? color.emissive.getHex() : 0 };
      this.mats.set(color.uuid, color);
    }
    m.position.set(x, y, z);
    m.userData.part = this.id;
    this.group.add(m);
    return m;
  }
  box(w, d, h, color, x, y, z0, o) { return this.add(new THREE.BoxGeometry(w, d, h), color, x, y, z0 + h / 2, o); }
  cylZ(r, h, color, x, y, z0, seg = 24, o) {
    const g = new THREE.CylinderGeometry(r, r, h, seg); g.rotateX(Math.PI / 2);
    return this.add(g, color, x, y, z0 + h / 2, o);
  }
  cylAxis(r, a, b, color, seg = 16, o) {   // cylinder between two points
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
    const g = new THREE.CylinderGeometry(r, r, A.distanceTo(B), seg);
    const m = this.add(g, color, ...A.clone().add(B).multiplyScalar(0.5).toArray(), o);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
    return m;
  }
  wire(points, color, r = 0.45) {
    const c = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
    return this.add(new THREE.TubeGeometry(c, 40, r, 8), color, 0, 0, 0, { roughness: 0.4 });
  }
}
const part = (id, o) => new Part(id, o);

// shared geometry helpers
const GOLD = '#d4b04c', SILVER = '#c8c9cc', BLACK = '#161616';
function headerPins(p, ref, zBottom, zTop, plastic = true) {
  const pads = FP[ref].pads;
  for (const pd of pads) {
    p.cylZ(0.32, zTop - zBottom, GOLD, pd.xy[0], pd.xy[1], zBottom, 8, { metalness: 0.8, roughness: 0.3 });
    if (plastic) p.box(2.5, 2.5, Z.hdr, BLACK, pd.xy[0], pd.xy[1], Z.modTop);
  }
}
function padCenter(ref) {
  const ps = FP[ref].pads.filter((q) => !q.np);
  return [ps.reduce((s, q) => s + q.xy[0], 0) / ps.length, ps.reduce((s, q) => s + q.xy[1], 0) / ps.length];
}
const pad = (ref, n) => FP[ref].pads.find((q) => q.n === String(n)).xy;

// ---------------------------------------------------------------- PCB with plotted copper + silk
function pcbTexture(side) {
  const S = 10, W = L.W, H = L.H;
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * S); cv.height = Math.round(H * S);
  const g = cv.getContext('2d');
  const X = (x) => x * S, Yc = (y) => (H - y) * S;
  g.fillStyle = '#1f6b3a'; g.fillRect(0, 0, cv.width, cv.height);
  // copper under mask
  g.lineCap = 'round';
  g.strokeStyle = '#2f8a4c';
  for (const [x1, y1, x2, y2, w, layer] of PCB.tracks) {
    if ((layer === 0) !== (side === 'top')) continue;
    g.lineWidth = w * S; g.beginPath(); g.moveTo(X(x1), Yc(y1)); g.lineTo(X(x2), Yc(y2)); g.stroke();
  }
  // pads (HASL), drills
  for (const f of PCB.fps) for (const q of f.pads) {
    const [x, y] = q.xy, [sx, sy] = q.sz;
    if (!q.np) {
      g.fillStyle = '#cfd0c8';
      g.save(); g.translate(X(x), Yc(y)); g.rotate(-(q.ang || 0) * Math.PI / 180);
      if (q.sh === 'rect') g.fillRect(-sx * S / 2, -sy * S / 2, sx * S, sy * S);
      else { g.beginPath(); g.roundRect(-sx * S / 2, -sy * S / 2, sx * S, sy * S, Math.min(sx, sy) * S / 2); g.fill(); }
      g.restore();
    }
    g.fillStyle = '#0b0d0c';
    const [dx, dy] = q.dr;
    g.save(); g.translate(X(x), Yc(y)); g.rotate(-(q.ang || 0) * Math.PI / 180);
    g.beginPath(); g.roundRect(-dx * S / 2, -(dy || dx) * S / 2, dx * S, (dy || dx) * S, Math.min(dx, dy || dx) * S / 2); g.fill();
    g.restore();
  }
  for (const v of PCB.vias) {
    g.fillStyle = '#cfd0c8'; g.beginPath(); g.arc(X(v.xy[0]), Yc(v.xy[1]), v.d * S / 2, 0, 7); g.fill();
    g.fillStyle = '#0b0d0c'; g.beginPath(); g.arc(X(v.xy[0]), Yc(v.xy[1]), v.dr * S / 2, 0, 7); g.fill();
  }
  // silk
  g.strokeStyle = g.fillStyle = '#f2f2ea';
  for (const s of PCB.silk) {
    if (s.back !== (side === 'bottom')) continue;
    g.lineWidth = Math.max(s.w, 0.12) * S;
    g.beginPath();
    if (s.k === 'l') { g.moveTo(X(s.a[0]), Yc(s.a[1])); g.lineTo(X(s.b[0]), Yc(s.b[1])); }
    else g.arc(X(s.a[0]), Yc(s.a[1]), s.r * S, 0, 7);
    g.stroke();
  }
  g.fillStyle = '#f2f2ea'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const t of PCB.silkText) {
    if (t.back !== (side === 'bottom')) continue;
    g.save(); g.translate(X(t.xy[0]), Yc(t.xy[1]));
    g.rotate(-(t.ang || 0) * Math.PI / 180);
    if (t.back) g.scale(-1, 1);         // back silk is drawn mirrored so it reads correctly from below
    g.font = `600 ${t.s * S * 1.32}px "Consolas", "DejaVu Sans Mono", monospace`;
    g.fillText(t.t, 0, 0);
    g.restore();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function pcbShape() {
  const I = L.INSET, [nx0, ny0, nx1] = L.NOTCH;
  const pts = [[I, I], [L.W - I, I], [L.W - I, L.H - I], [nx1, L.H - I], [nx1, ny0], [nx0, ny0]];
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  for (const f of PCB.fps) if (f.ref.startsWith('H')) {
    const h = new THREE.Path(); h.absarc(f.xy[0], f.xy[1], 1.6, 0, Math.PI * 2, true); s.holes.push(h);
  }
  return s;
}
function uvToPlate(geom) {
  const pos = geom.attributes.position, uv = geom.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / L.W, pos.getY(i) / L.H);
  uv.needsUpdate = true;
}

// ---------------------------------------------------------------- STL meshes (int16, 0.01 mm)
function stlGeometry(b64) {
  const bin = atob(b64), n = bin.length / 2;
  const view = new DataView(new ArrayBuffer(bin.length));
  for (let i = 0; i < bin.length; i++) view.setUint8(i, bin.charCodeAt(i));
  const pos = new Float32Array(n);
  for (let i = 0; i < n; i++) pos[i] = view.getInt16(i * 2, true) * D.stl.scale;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

function keycapGeometry() {
  const g = new THREE.CylinderGeometry(12.7 / Math.SQRT2, 18 / Math.SQRT2, 7.4, 4, 1);
  g.rotateY(Math.PI / 4); g.rotateX(Math.PI / 2);
  return g.toNonIndexed();
}

function oledTexture() {
  const bits = atob(D.oled);
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 64;
  const g = cv.getContext('2d'); const img = g.createImageData(128, 64);
  for (let y = 0; y < 64; y++) for (let x = 0; x < 128; x++) {
    const on = (bits.charCodeAt(y * 16 + (x >> 3)) >> (7 - (x & 7))) & 1, i = (y * 128 + x) * 4;
    img.data[i] = on ? 225 : 4; img.data[i + 1] = on ? 240 : 6; img.data[i + 2] = on ? 255 : 10; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.magFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// ---------------------------------------------------------------- build everything
function buildModel(STEP) {
  const P = L.P;
  const keyXY = [];
  for (let n = 0; n < 16; n++) keyXY.push([L.cx[n & 3], L.cy[3 - (n >> 2)]]);

  // ---- PCB
  {
    const p = part('pcb', { name: 'XO-Hugbox v1 PCB', step: 0, explode: 45, refs: [],
      info: '2-layer, 1.6 mm, HASL. Top = component side for keys, pots, OLED, power switch; the four modules, diodes and resistors go on the back.' });
    const shape = pcbShape();
    const body = new THREE.ExtrudeGeometry(shape, { depth: L.PCB_T, bevelEnabled: false, curveSegments: 16 });
    p.add(body, '#16502b', 0, 0, Z.pcb, { roughness: 0.7 });
    const top = new THREE.ShapeGeometry(shape, 16); uvToPlate(top);
    const topMat = new THREE.MeshStandardMaterial({ map: pcbTexture('top'), roughness: 0.6, metalness: 0.0 });
    p.add(top, topMat, 0, 0, Z.pcbTop + 0.01);
    const bot = new THREE.ShapeGeometry(shape, 16); uvToPlate(bot);
    const botMat = new THREE.MeshStandardMaterial({ map: pcbTexture('bottom'), roughness: 0.6, side: THREE.BackSide });
    p.add(bot, botMat, 0, 0, Z.pcb - 0.01);
  }

  // ---- diodes (back)
  {
    const p = part('diodes', { name: '1N4148 diodes D1-D16', qty: 16, step: STEP.diodes, explode: 45,
      refs: Array.from({ length: 16 }, (_, i) => 'D' + (i + 1)),
      info: 'One per pad, on the BACK. Black band (cathode) to the SQUARE pad - that pad is the row line R0-R3.' });
    for (let i = 1; i <= 16; i++) {
      const a = pad('D' + i, 1), b = pad('D' + i, 2);        // 1 = cathode (square pad)
      const zc = Z.pcb - 1.1, mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, dir = Math.sign(a[0] - b[0]);
      p.cylAxis(0.95, [mx - dir * 1.9, my, zc], [mx + dir * 1.9, my, zc], '#d24a1c', 16, { transparent: true, opacity: 0.85, roughness: 0.15 });
      p.cylAxis(0.98, [mx + dir * 1.1, my, zc], [mx + dir * 1.7, my, zc], '#111', 16);
      for (const q of [a, b]) {
        const end = [mx + Math.sign(q[0] - mx) * 1.9, my, zc];
        p.cylAxis(0.25, [q[0], q[1], zc], end, SILVER, 6, { metalness: 0.8 });
        p.cylAxis(0.25, [q[0], q[1], zc], [q[0], q[1], Z.pcbTop + 0.6], SILVER, 6, { metalness: 0.8 });

  {

      info: 'Battery sense divider (Vbat/2 into D9). 100k = brown-black-yellow-gold. No polarity. Back side.' });
    for (const r of ['R1', 'R2']) {
      const a = pad(r, 1), b = pad(r, 2), zc = Z.pcb - 1.4, mx = a[0], my = (a[1] + b[1]) / 2;
      p.cylAxis(1.25, [mx, my - 3.15, zc], [mx, my + 3.15, zc], '#d8c39a', 16);
      [['#6b3b1a', -2.0], ['#111', -1.0], ['#e3c21a', 0.0], ['#c9a44a', 2.1]].forEach(([c, o]) =>
        p.cylAxis(1.3, [mx, my + o - 0.3, zc], [mx, my + o + 0.3, zc], c, 16));
      for (const q of [a, b]) {
        p.cylAxis(0.28, [q[0], q[1], zc], [q[0], my + Math.sign(q[1] - my) * 3.15, zc], SILVER, 6, { metalness: 0.8 });
        p.cylAxis(0.28, [q[0], q[1], zc], [q[0], q[1], Z.pcbTop + 0.6], SILVER, 6, { metalness: 0.8 });

  // ---- XIAO ESP32-S3 (bottom, component side down, USB-C to the left wall)
  {
    const p = part('xiao', { name: 'Seeed XIAO ESP32-S3', step: STEP.xiao, explode: 30, refs: ['U1', 'J13'],
      info: 'Must be the S3 (native USB MIDI + 8 MB PSRAM). Shield can faces the floor, USB-C toward the left wall.' });

    p.wire([[x0 - 4.5, y0 - 6.5, Z.modTop + 0.2], [x0 - 4.5, y0 - 11, Z.modTop - 0.8], [j2[0], j2[1] + 1.5, Z.pcb - 2.2], [j2[0], j2[1], Z.pcb]], '#222', 0.4);

    const [x0, y0] = L.MAX_C, zb = Z.modTop - 1.6;

    const scr = p.add(new THREE.PlaneGeometry(29.42, 14.7), screenMat, ox, oy + L.OLED_WIN_OFF, Z.pcbTop + 3.62);
    scr.rotation.z = 0;
    for (const q of FP.U5.pads) p.cylZ(0.32, 4.0, GOLD, q.xy[0], q.xy[1], Z.pcb - 1.0, 8, { metalness: 0.8 });
  }

  // ---- power switch 12D00G (top, actuator through the plate)
  {
    const p = part('power', { name: '12D00G slide switch (power)', step: STEP.underplate, explode: 50, refs: ['SW18'],
      info: 'On the top side, actuator up through the plate slot. RAW (battery) - ON (switched rail to the XIAO BAT pads and divider).' });
    const [x, y] = L.PWR;
    p.box(8.7, 3.7, 3.7, '#c8c8c8', x, y, Z.pcbTop, { metalness: 0.8, roughness: 0.3 });
    p.box(1.5, 1.5, 5, BLACK, x - 0.75, y, Z.pcbTop + 3.7);
    for (const q of FP.SW18.pads) p.box(0.6, 0.3, 4.5, SILVER, q.xy[0], q.xy[1], Z.pcb - 1.2, { metalness: 0.8 });
  }

  // ---- top plate (STL) and bottom shell (STL)
  {
    const p = part('plate', { name: '3D-printed top plate', step: STEP.switches, explode: 75, xray: true,
      info: 'Print with a layer height that divides 1.5 mm (0.15 / 0.25 / 0.3) so the MX clip ledge is exact. Test one switch hole first.' });
    p.add(stlGeometry(D.stl.plate), '#f2efe6', 0, 0, Z.plate, { roughness: 0.8 });
  }
  {
    const p = part('shell', { name: '3D-printed bottom shell', step: STEP.speaker, explode: 0, xray: true,
      info: 'PCB rests on the five bosses at z = 16.5 mm; plate rests on the wall top. Speaker posts, battery cradle, USB-C and jack openings are built in.' });
    p.add(stlGeometry(D.stl.shell), '#d9d4c7', 0, 0, 0, { roughness: 0.85 });
  }

  // ---- speaker + M2.5 screws + leads from the MAX98357A
  {
    const p = part('speaker', { name: '3 W 8 Ω box speaker 28.2×31×15.3', step: STEP.speaker, explode: 18,
      info: 'Face up against the plate grille (sits in the 0.8 mm locator), ears screwed to the two shell posts with M2.5×6 self-tappers. Ear spacing ~37 mm is an estimate - measure yours.' });
    const [sx, sy] = L.SPK_C, top = Z.plate + 0.8, h = 15.3;
    p.box(31, 28.2, h, '#1b1b1b', sx, sy, top - h);
    p.cylZ(10.5, 0.4, '#2c2c2c', sx, sy, top - 0.2, 40);
    p.cylZ(4, 0.6, '#3a3a3a', sx, sy, top - 0.1, 24);
    const ez = top - L.SPK_EAR_DROP - L.SPK_EAR_T / 2;
    for (const s of [-1, 1]) {
      p.box(11, L.SPK_EAR_PITCH / 2 - 14.1 + 3.2, L.SPK_EAR_T, '#1b1b1b', sx, sy + s * (14.1 + (L.SPK_EAR_PITCH / 2 - 14.1 + 3.2) / 2), ez);
    }
    // leads from the MAX98357A +/- to the speaker tabs
    const mx = L.MAX_C[0], my = L.MAX_C[1] - 7.6;
    p.wire([[mx - 1.5, my, Z.modTop - 2.9], [mx - 6, my + 8, 6], [sx + 10, sy - 20, 6], [sx + 6, sy - 14.1, top - 6]], '#d03030', 0.35);
    p.wire([[mx + 1.5, my, Z.modTop - 2.9], [mx - 3, my + 9, 5], [sx + 12, sy - 19, 5], [sx + 8, sy - 14.1, top - 6]], '#222', 0.35);
  }
  {
    const p = part('spkScrews', { name: 'M2.5×6 self-tapping screws (speaker)', qty: 2, step: STEP.speaker, explode: 26,
      info: 'Through the speaker ears into the two shell posts.' });
    const ez = Z.plate + 0.8 - L.SPK_EAR_DROP + L.SPK_EAR_T / 2;
    for (const s of [-1, 1]) {
      const y = L.SPK_C[1] + s * L.SPK_EAR_PITCH / 2;
      p.cylZ(2.2, 1.6, SILVER, L.SPK_C[0], y, ez, 20, { metalness: 0.6, roughness: 0.35 });
      p.cylZ(1.25, 6, SILVER, L.SPK_C[0], y, ez - 6, 12, { metalness: 0.6, roughness: 0.35 });
    }
  }

  // ---- LiPo in the cradle + leads to J11, U.FL antenna on the left wall
  {
    const p = part('battery', { name: 'LP102540 1100 mAh LiPo', step: STEP.battery, explode: 8, refs: ['J11'],
      info: 'In the shell cradle under the keys. Leads to the BAT+ / BAT- pads (J11). Check polarity against the pads with a meter - lead colours are not always right.' });
    p.box(25, 40, 10, '#aeb6c0', 46, 40, 2.2, { metalness: 0.5, roughness: 0.35 });
    p.box(23, 5, 3, '#2b6a3b', 46, 62.2, 5.5);    // protection board
    const a = pad('J11', 1), b = pad('J11', 2);
    p.wire([[42, 63.5, 7], [30, 62, 8], [10, b[1] + 2, 11], [b[0], b[1], Z.pcb - 1.5], [b[0], b[1], Z.pcb]], '#d03030', 0.45);
    p.wire([[46, 63.5, 7], [30, 60, 7.5], [10, a[1] - 2, 10.5], [a[0], a[1], Z.pcb - 1.5], [a[0], a[1], Z.pcb]], '#222', 0.45);
  }
  // ---- INMP441 mic: label (port) side up on its own header, straight above J_MIC; the plate pocket closes over it.
  //      The can is underneath, facing the board; the header plastic is the 2.5 mm spacer. MTDI wire on the back.
  {
    const p = part('mic', { name: 'INMP441 I2S mic module', step: STEP.mic, explode: 50, refs: ['J_MIC'],
      info: 'Label side up (the sound port is the hole in the middle of that side), on a 2×3 header into J_MIC: SCK WS L/R toward the knobs, SD VDD GND toward the keys. L/R is tied to GND, so the mic sends on the left slot.' });
    const [mx, my] = L.MIC_C, R = L.MIC_D / 2, z0 = Z.pcbTop + L.MIC_SPACER;
    p.cylZ(R, L.MIC_PCB_T, '#1c1f26', mx, my, z0, 48);                                   // module board
    p.cylZ(1.1, 0.05, '#c89a50', mx, my, z0 + L.MIC_PCB_T, 24);                           // port ring
    p.cylZ(0.45, 0.06, '#111', mx, my, z0 + L.MIC_PCB_T + 0.01, 16);                      // port
    p.box(4.7, 3.8, 1.0, '#c0c0c0', mx + 0.6, my, z0 - 1.0, { metalness: 0.7, roughness: 0.3 });   // mic can (underside)
    for (const j of [-1, 1]) {
      const py = my + j * L.MIC_ROW_DY;
      p.box(3 * L.MIC_PITCH, 2.5, L.MIC_SPACER, '#222', mx, py, Z.pcbTop);                // header plastic
      for (const i of [-1, 0, 1])
        p.box(0.64, 0.64, L.MIC_SPACER + L.MIC_PCB_T + Z.pcbTop - Z.pcb + 1.2, '#d4af37', mx + i * L.MIC_PITCH, py, Z.pcb - 1.0,
          { metalness: 0.8, roughness: 0.3 });
    }
  }
  {
    const p = part('mtdi', { name: 'MTDI wire (mic data)', step: STEP.xiao, explode: 8, refs: ['J_MTDI'],
      info: 'Solder it to the MTDI pad (GPIO41) on the XIAO\'s underside BEFORE mounting the XIAO, like the battery leads; it lands in J_MTDI next to the XIAO.' });
    const [tx, ty] = L.MTDI_PAD;
    p.wire([[L.XIAO_C[0] + 2, L.XIAO_C[1] - 4, Z.modTop + 0.6], [tx + 1, ty + 1.5, Z.modTop + 0.8], [tx, ty, Z.pcb - 1.2], [tx, ty, Z.pcb]], '#e0b040', 0.3);
  }
  {
    const p = part('antenna', { name: 'U.FL antenna (XIAO S3)', step: STEP.battery, explode: 8,
      info: 'Flat antenna stuck to the inside of a wall, cable to the U.FL socket on the XIAO. Keep it clear of the speaker magnet and the battery.' });
    p.box(0.3, 20, 6, '#b88a2a', L.WALL + 0.3, 112, 6, { metalness: 0.6 });
    p.wire([[L.WALL + 0.6, 104, 8], [5, 98, 9], [L.XIAO_C[0] + 6.5, L.XIAO_C[1] - 5.5, 11.6]], '#333', 0.3);
  }

  // ---- case screws: 4x M3x12 countersunk in the corners. The pot-strip position is a screwless support post.
  {
    const support = new Set(L.SUPPORT_ONLY || []);
    const p = part('screws', { name: 'M3×12 countersunk screws (corners)', qty: L.HOLES.length - support.size, step: STEP.close, explode: 120,
      info: 'In the four corners, through the plate and PCB, self-tapping into the shell bosses - snug, not tight.' });
    const MS = { metalness: 0.6, roughness: 0.35 };
    L.HOLES.forEach(([x, y], i) => {
      if (support.has(i)) return;                    // no screw: boss + spacer only, plate solid on top
      const top = Z.plateTop, len = 12;
      const g = new THREE.CylinderGeometry(3.2, 1.6, 1.75, 24); g.rotateX(Math.PI / 2);
      p.add(g, SILVER, x, y, top - 0.875, MS);
      p.cylZ(1.45, len - 1.75, SILVER, x, y, top - len, 12, MS);
    });
  }

  // ---- keycaps, knobs, nuts
  {
    const p = part('keycaps', { name: 'Keycaps (16 pads + orange shift)', qty: 17, step: STEP.caps, explode: 100,
      info: '1u MX keycaps. Last thing on, after the case is closed.' });
    const g = keycapGeometry();
    [...keyXY, L.SHIFT].forEach(([x, y], i) => p.add(g, i === 16 ? '#e8792b' : '#ece9e1', x, y, Z.plateTop + 6.6 + 3.7, { roughness: 0.7 }));
  }
  {
    // 15 x 17 mm black anodised aluminium knob (set screw, 6 mm bore): knurled grip band at the base,
    // smooth upper body, black top face with a bright diamond-cut chamfer and pointer line.
    const p = part('knobs', { name: '15×17 mm aluminium knobs + pot nuts', qty: 4, step: STEP.caps, explode: 100,
      info: 'Nut and washer clamp the pot to the raised strip, then fit the 15×17 mm knobs and tighten the set screws.' });
    const KR = 7.5, KH = 17, KNURL_H = 13, CHAMF = 0.6;
    const BLACK = { metalness: 0.55, roughness: 0.38 }, BRIGHT = { metalness: 0.95, roughness: 0.2 };
    const knurl = new THREE.CylinderGeometry(KR, KR, KNURL_H, 160, 1);
    {
      const pos = knurl.attributes.position;
      for (let v = 0; v < pos.count; v++) {
        const x = pos.getX(v), z = pos.getZ(v), r = Math.hypot(x, z);
        if (r < KR * 0.9) continue;                          // cap centre vertices
        const k = 1 - 0.035 * (0.5 + 0.5 * Math.cos(80 * Math.atan2(z, x)));
        pos.setX(v, x * k); pos.setZ(v, z * k);
      }
      knurl.computeVertexNormals(); knurl.rotateX(Math.PI / 2);
    }
    const chamfer = new THREE.CylinderGeometry(KR - CHAMF, KR, CHAMF, 64, 1, true); chamfer.rotateX(Math.PI / 2);
    for (let i = 0; i < 4; i++) {
      const x = L.cx[i], z0 = Z.strip + 2;
      const nut = new THREE.CylinderGeometry(5.5, 5.5, 2, 6); nut.rotateX(Math.PI / 2);
      p.add(nut, '#9a9a9a', x, L.POT_Y, Z.strip + 1, { metalness: 0.85, roughness: 0.3 });
      p.add(knurl, '#1a1a1a', x, L.POT_Y, z0 + KNURL_H / 2, BLACK);
      p.cylZ(KR, KH - KNURL_H - CHAMF, '#161616', x, L.POT_Y, z0 + KNURL_H, 64, BLACK);
      p.add(chamfer, '#d6d6d6', x, L.POT_Y, z0 + KH - CHAMF / 2, BRIGHT);
      p.cylZ(KR - CHAMF, CHAMF, '#0c0c0c', x, L.POT_Y, z0 + KH - CHAMF, 64, { metalness: 0.3, roughness: 0.5 });
      p.box(0.45, 4.6, 0.05, '#d6d6d6', x, L.POT_Y + (KR - CHAMF) - 2.3, z0 + KH, BRIGHT);
    }
  }
  return { screenMat };
}

return { L, PCB, FP, Z, PADNAMES, parts, root, buildModel };
};

      ghost: ['plate', 'switches'], offsets: { plate: 45, switches: 45 },
      body: `
        <div class="callout fix"><b>Before the plate:</b> all three sit <i>under</i> the plate (pot cans and lugs in the strip pockets,
        OLED in its window pocket, switch body in its slot). Place them now, solder them in step 8.</div>
        <ol>
          <li><b>4× WH148 B10K</b>, straight-lug type: the lugs leave the side of the can about 5.3 mm up and are too short to
          bend down to the board. First, on the bench, solder a <b>diode lead offcut</b> to the tip of each lug, pointing straight
          down past the bottom of the can (about 9 mm sticking out below the lug).</li>
          <li>Set each pot on the board with its <b>lugs facing the keys</b> and the three legs in the plated oval slots
          (GND, wiper, 3V3 left to right). The slots are long, so the exact leg position does not matter.</li>
          <li><b>OLED</b>: pull the black plastic off its header. Header toward the pots, so the module is <b>upside down</b>
          (the firmware's <code>U8G2_R2</code> turns the picture back). Board pads read SDA SCL VCC GND left to right.
          It must end up <b>0.8 mm above the board</b> - the plate pocket sets that height in the next step.</li>
          <li><b>12D00G power switch</b>: three pins in, actuator up.</li>
        </ol>`,
    },
    {
      title: 'Plate onto the PCB, solder from below', view: V.plate, focus: ['plate', 'switches', 'spacers'],
      body: `
        <ol>
          <li>Put a <b>1 mm spacer</b> on each of the five screw holes.</li>
          <li>Lower plate + switches onto the board: every switch's pins through, pot shafts up through their holes,
          OLED glass into its window, slide actuator in its slot. Thread the pot nuts on loosely to hold the stack.</li>
          <li>Flip it and solder: <b>17 switches</b>, then the <b>pot legs</b> (clip them flush afterwards), the <b>OLED</b> (check it is level and 0.8 mm up) and the <b>power switch</b>.</li>
        </ol>
        <div class="callout tip">Press each switch while it cools so it sits flat in the plate.</div>`,
    },
    {
      title: 'Clip PCM-area pins, then the PCM5102A (back)', view: V.pcm, focus: ['pcm'],
      body: `
        <ol>
          <li><b>Clip flush</b> the pins under the PCM5102A outline: the <b>shift switch</b> (2 pins) and the <b>power switch</b> (3 pins).
          A strip of Kapton over them is cheap insurance.</li>
          <li>Set the jumpers <b>before</b> mounting (one face ends up against the board):
          <b>FLT L, DEMP L, XSMT H, FMT L</b>. <b>SCK</b> needs no jumper - it is tied to GND on the PCB.</li>
          <li>Module <b>printed side down</b>, along the <b>right wall</b>, jack end toward the keys. The jack opens out the module's
          long <b>VIN-side edge</b> and lines up with the hole in the right wall. Header SCK BCK DIN LCK GND VIN.</li>
        </ol>
        <div class="callout fix"><b>Why here:</b> SW17 and SW18 pins are inside the PCM5102A outline; with the module already on they
        could not be soldered or clipped.</div>`,
    },
    {
      title: 'Speaker into the shell', view: V.shellTop, focus: ['speaker', 'spkScrews'], hide: BOARD,
      body: `
        <ol>
          <li>Speaker <b>face up</b> - it presses against the plate grille when the case closes.</li>
          <li>Screw both ears to the two shell posts with <b>2× M2.5×6</b> self-tappers.</li>
          <li>Ear spacing in the design is ~37 mm, estimated from a listing photo: <b>measure your speaker</b> before printing the shell.</li>
          <li>Solder the leads from the MAX98357A + / − to the speaker tabs.</li>
        </ol>`,
    },
    {
      title: 'Battery and antenna', view: V.battery, focus: ['battery', 'antenna'], hide: BOARD,
      body: `
        <ol>
          <li>Power switch <b>OFF</b>.</li>
          <li><b>LP102540 LiPo</b> (with protection board) into the cradle under the keys.</li>
          <li>Leads to the <b>BAT+ / BAT−</b> pads (J11, left edge under the keys), soldered from the back.</li>
          <li>Plug the <b>U.FL antenna</b> into the XIAO and stick it to the inside of a wall, away from the speaker magnet and the battery.</li>
        </ol>
        <div class="callout warn"><b>Polarity:</b> check the battery's red/black against the BAT+ / BAT− pads <b>with a meter</b>
        before soldering. LiPo lead colours and JST pinouts are not reliable, and there is no reverse protection on the board.</div>
        <div class="callout note">This is the last point where both the battery pads and the cradle are easy to reach.</div>`,
    },
    {
      title: 'Board and plate into the shell', view: V.close, focus: ['screws'], ghost: ['shell'],
      body: `
        <ol>
          <li>Lower the board + plate into the shell: USB-C into the left-wall opening, the jack into the right-wall hole.</li>
          <li><b>4× M3×12 countersunk</b> in the corners, from the top. They self-tap into the shell bosses -
          snug, don't strip the plastic.</li>
          <li>There is <b>no fifth screw</b>: by the right-hand knob the shell boss and its 1 mm spacer just support the board,
          and the corner screws clamp it. The plate is solid there.</li>
          <li>Tighten the pot nuts on the strip.</li>
        </ol>`,
    },
    {
      title: 'Keycaps and knobs', view: V.caps, focus: ['keycaps', 'knobs'],
      body: `<p>Keycaps on all 17 switches (shift is the orange one, top right), then the four <b>15×17 mm knobs</b>: line them up at the same position and tighten the set screws.</p>`,
    },
    {
      title: 'First power-on: bring-up', view: V.screen, focus: [], screen: true,
      body: `
        <p>Flash the bring-up sketch from <code>firmware/</code>:</p>
        <pre>~/.platformio/penv/Scripts/pio.exe run -e bringup -t upload
pio device monitor</pre>
        <ol>
          <li>Serial should list <b>0x20</b> (PCF8574) and <b>0x3C</b> (OLED).</li>
          <li>The OLED shows the bring-up page: title, battery voltage, four pot bars and the 4×4 pad grid.</li>
          <li>Hold a pad for a tone (pad 0 = C4 … pad 15 = D#5); shift + pad = 1 kHz; the left knob is volume.</li>
        </ol>
        <p>Try it before the parts arrive: open the <b>emulator</b> at <code>sim/index.html</code> - it runs the same bring-up code.</p>
        <div class="callout tip">Missing 0x20 → check the four PCF I2C wires and the address bridges. Missing 0x3C → OLED pins/order.
        A dead pad → that pad's diode is reversed.</div>`,
    },
  ];
  return { STEP, steps, BOM, BOARD };
})();

</script>
<script type="module">/* guide.js */
// XO-Hugbox interactive build guide: scene, step engine, hover/click labels.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const M = window.buildHugboxModel(THREE);
const G = window.HUGBOX_GUIDE;
const { parts, root, FP, PADNAMES } = M;
const { screenMat } = M.buildModel(G.STEP);
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- renderer / scene
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0b0b0b');   // XOXO black
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight('#ffffff', '#40444c', 0.6));
const sun = new THREE.DirectionalLight('#ffffff', 1.4); sun.position.set(80, -60, 200); scene.add(sun);
const under = new THREE.DirectionalLight('#ffffff', 0.6); under.position.set(-40, 60, -150); scene.add(under);
scene.add(root);
// ground grid for scale (10 mm)
const grid = new THREE.GridHelper(300, 30, '#2a2a28', '#1a1a19'); grid.rotateX(Math.PI / 2); grid.position.set(46, 84, -0.05); scene.add(grid);

const camera = new THREE.PerspectiveCamera(35, 1, 1, 3000);
camera.up.set(0, 0, 1);
camera.position.set(150, -95, 150);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(46, 84, 18);
controls.enableDamping = true;
controls.dampingFactor = 0.12;

function resize() {
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

// ---------------------------------------------------------------- part state
const ACCENT = new THREE.Color('#ff3b1f');   // XOXO signal red: parts in this step
function setState(p, state) {
  p.state = state;
  p.group.visible = state !== 'hidden';
  for (const m of p.mats.values()) {
    const b = m.userData.base;
    if (state === 'ghost') { m.transparent = true; m.opacity = 0.08; m.depthWrite = false; }
    else { m.transparent = b.transparent; m.opacity = b.opacity; m.depthWrite = true; }
    if (m.emissive) m.emissive.setHex(b.emissive);
    m.needsUpdate = true;
  }
}

let explode = 0, explodeTarget = 0;
let stepIdx = 0;
const offsetNow = new Map(), offsetTarget = new Map();
for (const id of parts.keys()) { offsetNow.set(id, 0); offsetTarget.set(id, 0); }

// ---------------------------------------------------------------- camera tween
let tween = null;
const DIST = 1.65;   // presets are written close; scale them out from the target
const presetPos = (pos, tgt) => new THREE.Vector3(...pos).sub(new THREE.Vector3(...tgt)).multiplyScalar(DIST).add(new THREE.Vector3(...tgt));
function flyTo([pos, tgt], ms = 900) {
  tween = { t0: performance.now(), ms, p0: camera.position.clone(), t0v: controls.target.clone(),
    p1: presetPos(pos, tgt), t1: new THREE.Vector3(...tgt) };
}
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// ---------------------------------------------------------------- steps UI
const steps = G.steps;
const stepList = $('stepList');
steps.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'dot'; b.title = `${i}. ${s.title}`; b.textContent = i;
  b.addEventListener('click', () => goStep(i));
  stepList.appendChild(b);
});

function goStep(i) {
  stepIdx = Math.max(0, Math.min(steps.length - 1, i));
  const s = steps[stepIdx];
  const focus = new Set(s.focus || []), ghost = new Set(s.ghost || []), hide = new Set(s.hide || []);
  for (const p of parts.values()) {
    let st;
    if (s.all) st = 'normal';
    else if (hide.has(p.id)) st = 'hidden';
    else if (p.step > stepIdx) st = 'hidden';
    else if (ghost.has(p.id)) st = 'ghost';
    else if (focus.has(p.id)) st = 'focus';
    else st = 'normal';
    setState(p, st);
    offsetTarget.set(p.id, (s.offsets && s.offsets[p.id]) || 0);
  }
  screenMat.color.set(s.screen || s.all ? '#ffffff' : '#000000');
  explodeTarget = s.explode || 0;
  $('explode').value = explodeTarget;
  flyTo(s.view);
  // text
  $('stepNum').textContent = stepIdx === 0 ? 'Start' : `Step ${stepIdx} of ${steps.length - 1}`;
  $('stepTitle').textContent = s.title;
  const chips = [...focus].map((id) => parts.get(id)).filter(Boolean)
    .map((p) => `<button class="chip" data-part="${p.id}">${p.qty > 1 ? p.qty + '× ' : ''}${p.name}</button>`).join('');
  $('stepBody').innerHTML = (chips ? `<div class="chips">${chips}</div>` : '') + s.body;
  $('stepBody').querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => select(c.dataset.part)));
  $('stepBody').scrollTop = 0;
  [...stepList.children].forEach((b, k) => { b.classList.toggle('on', k === stepIdx); b.classList.toggle('done', k < stepIdx); });
  $('prev').disabled = stepIdx === 0;
  $('next').disabled = stepIdx === steps.length - 1;
  select(null);
  try { localStorage.setItem('hugbox-guide-step', String(stepIdx)); } catch (e) {}
}
$('prev').addEventListener('click', () => goStep(stepIdx - 1));
$('next').addEventListener('click', () => goStep(stepIdx + 1));
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') goStep(stepIdx + 1);
  if (e.key === 'ArrowLeft') goStep(stepIdx - 1);
});
$('explode').addEventListener('input', (e) => { explodeTarget = +e.target.value; });
$('xray').addEventListener('change', (e) => {
  for (const id of ['shell', 'plate']) { const p = parts.get(id); if (p.state !== 'hidden') setState(p, e.target.checked ? 'ghost' : 'normal'); }
});
$('viewTop').addEventListener('click', () => flyTo([[46, 70, 260], [46, 84, 15]]));
$('viewBottom').addEventListener('click', () => flyTo([[46, 70, -250], [46, 84, 15]]));
$('viewIso').addEventListener('click', () => flyTo(steps[0].view));

// ---------------------------------------------------------------- hover + click
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tip = $('tip');
let hoverId = null, downAt = null;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const targets = [];
  for (const p of parts.values()) if (p.group.visible && p.state !== 'ghost') targets.push(p.group);
  const hit = ray.intersectObjects(targets, true).find((h) => h.object.visible);
  return hit ? hit.object.userData.part : null;
}
renderer.domElement.addEventListener('pointermove', (ev) => {
  const id = pick(ev);
  hoverId = id;
  if (id) {
    const p = parts.get(id);
    tip.style.display = 'block';
    tip.innerHTML = `<b>${p.qty > 1 ? p.qty + '× ' : ''}${p.name}</b><span>click for details</span>`;
    const r = view.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 260) + 'px';
    tip.style.top = (ev.clientY - r.top + 14) + 'px';
    renderer.domElement.style.cursor = 'pointer';
  } else { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; }
});
renderer.domElement.addEventListener('pointerleave', () => { tip.style.display = 'none'; hoverId = null; });
renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 4) return;
  select(pick(ev));
});

let selected = null;
function select(id) {
  selected = id;
  const card = $('partCard');
  if (!id) { card.style.display = 'none'; return; }
  const p = parts.get(id);
  let html = `<div class="pc-h"><b>${p.qty > 1 ? p.qty + '× ' : ''}${p.name}</b><button id="pcClose" aria-label="Close">×</button></div><p>${p.info}</p>`;
  if (p.refs.length && p.refs.length <= 2) {
    for (const ref of p.refs) {
      const f = FP[ref]; if (!f) continue;
      const names = PADNAMES[ref];
      html += `<div class="pins"><div class="ref">${ref}${f.back ? ' (back)' : ''}</div>` + f.pads.filter((q) => !q.np).map((q, i) =>
        `<span><i>${names ? names[i] : 'pin ' + q.n}</i>${q.net || '-'}</span>`).join('') + '</div>';
    }
  } else if (p.refs.length) html += `<p class="dim">Refs: ${p.refs[0]}–${p.refs[p.refs.length - 1]}</p>`;
  html += `<p class="dim">Installed in step ${p.step === 0 ? '-' : p.step}: ${steps[p.step] ? steps[p.step].title : ''}</p>`;
  card.innerHTML = html;
  card.style.display = 'block';
  $('pcClose').addEventListener('click', () => select(null));
}

// ---------------------------------------------------------------- floating labels for the step's parts
const labelLayer = $('labels');
const labelEls = new Map();
const box = new THREE.Box3(), v = new THREE.Vector3();
function updateLabels() {
  const s = steps[stepIdx];
  const want = new Set(s.all ? [] : (s.focus || []));
  if (selected) want.add(selected);
  for (const [id, el] of labelEls) if (!want.has(id)) { el.remove(); labelEls.delete(id); }
  const r = view.getBoundingClientRect();
  for (const id of want) {
    const p = parts.get(id);
    if (!p || !p.group.visible) continue;
    let el = labelEls.get(id);
    if (!el) { el = document.createElement('div'); el.className = 'lbl'; el.textContent = p.name; labelLayer.appendChild(el); labelEls.set(id, el); }
    box.setFromObject(p.group);
    box.getCenter(v); v.z = box.max.z;
    v.project(camera);
    const behind = v.z > 1;
    el.style.display = behind ? 'none' : 'block';
    el.style.transform = `translate(${(v.x * 0.5 + 0.5) * r.width}px, ${(-v.y * 0.5 + 0.5) * r.height}px) translate(-50%, -130%)`;
  }
}

// ---------------------------------------------------------------- loop
function frame(t) {
  requestAnimationFrame(frame);
  explode += (explodeTarget - explode) * 0.12;
  for (const p of parts.values()) {
    const o = offsetNow.get(p.id) + (offsetTarget.get(p.id) - offsetNow.get(p.id)) * 0.1;
    offsetNow.set(p.id, o);
    p.group.position.z = explode * p.explode + o;
    if (p.state === 'focus') {
      const k = (0.12 + 0.09 * Math.sin(t / 260)) * (p.xray ? 0.35 : 1);   // big printed parts glow less
      for (const m of p.mats.values()) if (m.emissive) m.emissive.copy(m.color).lerp(ACCENT, 0.35).multiplyScalar(k * 2.2);   // brighten, keep the part's hue
    }
  }
  if (tween) {
    const k = Math.min(1, (t - tween.t0) / tween.ms), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0v, tween.t1, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
}

resize();
let start = 0;
try { start = +(localStorage.getItem('hugbox-guide-step') || 0); } catch (e) {}
const hashStep = /step=(\d+)/.exec(location.hash);
if (hashStep) start = +hashStep[1];
goStep(start || 0);
camera.position.copy(presetPos(...steps[stepIdx].view)); controls.target.set(...steps[stepIdx].view[1]); tween = null;
requestAnimationFrame(frame);
$('loading').remove();
window.hugboxGuide = { goStep, parts, camera, controls, select };

</script>
</body>
