; XO-Hugbox firmware (Seeed XIAO ESP32-S3, Arduino-ESP32 core 3.x via pioarduino)
; All device behaviour is in lib/hugbox_core, shared with the browser emulator (sim/).
[platformio]
default_envs = hugbox

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi      ; 8 MB octal PSRAM
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
lib_deps =
    olikraus/U8g2@^2.35.30

; The instrument: UI, sequencer, chord/arp, synth + sampler engine.
[env:hugbox]
build_src_filter = +<hugbox/>
; TinyUSB (USB OTG) mode: the USB port is a serial port + a class-compliant MIDI port at the same time.
; If an upload ever fails to find the port, hold BOOT while plugging in.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
build_unflags = -DARDUINO_USB_MODE=1
board_build.filesystem = littlefs
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0

; Hardware bring-up: USB serial, I2C scan, OLED, pad matrix, pots, shift, battery, I2S test tone.
[env:bringup]
build_src_filter = +<bringup/>

; v1.1 breadboard test: I2S0 master -> PCM5102A, I2S1 slave -> MAX98357A on D10, shift on the D9 divider.
; See docs/speaker-path-plan.md section 3.
[env:duali2s]
build_src_filter = +<duali2s/>
lib_deps =
